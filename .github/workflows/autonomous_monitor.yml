name: Autonomous DB Monitor (24/7 Cloud Agent)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests psycopg2-binary

      - name: Run Autonomous Monitoring Cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python agent.py --once
